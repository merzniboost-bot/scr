{% extends "base.html" %}

{% block title %}Создать курс - СКР Digital{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 60px auto; padding: 40px 20px;">
    <div class="card" style="background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);">
        <div style="margin-bottom: 30px;">
            <a href="{{ url_for('courses.list') }}" style="color: #12A0F4; text-decoration: none; font-weight: 600;">← Назад к курсам</a>
        </div>
        
        <h1 style="font-size: 36px; margin-bottom: 30px; color: #081844;">Создать новый курс</h1>
        
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="title" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Название курса *</label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       required 
                       minlength="5"
                       placeholder="Например: Основы программирования на Python"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.3s;">
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="description" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Описание курса</label>
                <textarea id="description" 
                          name="description" 
                          rows="6"
                          placeholder="Опишите, чему научатся студенты на этом курсе..."
                          style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: inherit; resize: vertical;"></textarea>
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="preview" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Превью курса (изображение)</label>
                <input type="file" 
                       id="preview" 
                       name="preview" 
                       accept="image/*"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
                <small style="color: #666; margin-top: 5px; display: block;">Рекомендуемый размер: 1200x600px. Форматы: JPG, PNG</small>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 40px;">
                <button type="submit" 
                        class="btn" 
                        style="flex: 1; padding: 16px; background: linear-gradient(135deg, #0A5D8E, #12A0F4); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s;">
                    Создать курс
                </button>
                <a href="{{ url_for('courses.list') }}" 
                   class="btn" 
                   style="flex: 1; padding: 16px; background: #f0f0f0; color: #333; text-align: center; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #12A0F4;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(18, 160, 244, 0.3);
}
</style>
{% endblock %}
