{% extends "base.html" %}

{% block title %}Изменить пароль - СКР Digital{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 60px auto; padding: 40px 20px;">
    <div style="background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);">
        <div style="margin-bottom: 30px;">
            <a href="{{ url_for('user.profile') }}" style="color: #12A0F4; text-decoration: none; font-weight: 600;">← Назад к профилю</a>
        </div>
        
        <h1 style="font-size: 36px; margin-bottom: 30px; color: #081844;">Изменить пароль</h1>
        
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="current_password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Текущий пароль *</label>
                <input type="password" 
                       id="current_password" 
                       name="current_password" 
                       required
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="new_password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Новый пароль *</label>
                <input type="password" 
                       id="new_password" 
                       name="new_password" 
                       required
                       minlength="8"
                       placeholder="Минимум 8 символов"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="confirm_password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Подтвердите новый пароль *</label>
                <input type="password" 
                       id="confirm_password" 
                       name="confirm_password" 
                       required
                       minlength="8"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
            </div>
            
            <div style="background: #fff3cd; padding: 15px; border-radius: 10px; margin-bottom: 25px; border-left: 4px solid #ffc107;">
                <p style="margin: 0; color: #856404; font-size: 14px;">
                    ⚠️ Пароль должен содержать минимум 8 символов. Используйте комбинацию букв, цифр и символов для безопасности.
                </p>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 40px;">
                <button type="submit" 
                        style="flex: 1; padding: 16px; background: linear-gradient(135deg, #0A5D8E, #12A0F4); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;">
                    Изменить пароль
                </button>
                <a href="{{ url_for('user.profile') }}" 
                   style="flex: 1; padding: 16px; background: #f0f0f0; color: #333; text-align: center; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.form-group input:focus {
    outline: none;
    border-color: #12A0F4;
}
</style>

<script>
// Проверка совпадения паролей
document.querySelector('form').addEventListener('submit', function(e) {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert('Пароли не совпадают!');
        return false;
    }
    
    if (newPassword.length < 8) {
        e.preventDefault();
        alert('Пароль должен содержать минимум 8 символов!');
        return false;
    }
});
</script>
{% endblock %}
