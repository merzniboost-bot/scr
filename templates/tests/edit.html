{% extends "base.html" %}

{% block title %}Редактировать тест - Симферопольский Колледж Радиоэлектроники{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 60px auto; padding: 40px 20px;">
    <div style="background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);">
        <div style="margin-bottom: 30px;">
            <a href="{{ url_for('tests.manage', test_id=test.id) }}" style="color: #12A0F4; text-decoration: none; font-weight: 600;">← Назад к тесту</a>
        </div>
        
        <h1 style="font-size: 36px; margin-bottom: 30px; color: #081844;">Редактировать тест</h1>
        
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="title" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Название теста *</label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       required 
                       minlength="5"
                       value="{{ test.title }}"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="max_attempts" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Максимум попыток</label>
                <input type="number" 
                       id="max_attempts" 
                       name="max_attempts" 
                       min="0"
                       value="{{ test.max_attempts or 0 }}"
                       placeholder="0 = неограниченно"
                       style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;">
                <small style="color: #666; margin-top: 5px; display: block;">Укажите 0 для неограниченного количества попыток</small>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 40px;">
                <button type="submit" 
                        style="flex: 1; padding: 16px; background: linear-gradient(135deg, #0A5D8E, #12A0F4); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;">
                    Сохранить изменения
                </button>
                <a href="{{ url_for('tests.manage', test_id=test.id) }}" 
                   style="flex: 1; padding: 16px; background: #f0f0f0; color: #333; text-align: center; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.form-group input:focus {
    outline: none;
    border-color: #12A0F4;
}
</style>
{% endblock %}
